name: v2 tests

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

jobs:
  test-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run v2 tests
        env:
          NENOY_V2_ENV: test
        run: pytest tests_v2 -q
