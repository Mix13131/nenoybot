name: v2 tests

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

jobs:
  test-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nenoy_test
          POSTGRES_PASSWORD: nenoy_test
          POSTGRES_DB: nenoy_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nenoy_test -d nenoy_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run v2 tests
        env:
          NENOY_V2_ENV: test
          NENOY_V2_TEST_DATABASE_URL: postgresql://nenoy_test:nenoy_test@127.0.0.1:5432/nenoy_v2_test
        run: pytest tests_v2 -q
